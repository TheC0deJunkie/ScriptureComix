<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScriptureComix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Comic Neue', cursive;
      }
      h1, h2, h3, h4, h5, h6, .comic-font {
        font-family: 'Bangers', system-ui;
        letter-spacing: 0.05em;
      }
      .comic-shadow {
        box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
      }
      .comic-border {
        border: 3px solid black;
      }
      /* Motion: small, quick, and off for people who asked for less */
      @keyframes sc-fade-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sc-pop { from { opacity: 0; transform: translateY(6px) scale(.98) } to { opacity: 1; transform: none } }
      @keyframes sc-slide-up { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
      @keyframes sc-slide-in-right { from { opacity: 0; transform: translateX(24px) } to { opacity: 1; transform: none } }
      @keyframes sc-bounce-slow { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .animate-fade-in { animation: sc-fade-in .18s ease-out both }
      .animate-pop { animation: sc-pop .16s ease-out both }
      .animate-slide-up { animation: sc-slide-up .22s cubic-bezier(.2,.8,.2,1) both }
      .animate-slide-in-right { animation: sc-slide-in-right .22s cubic-bezier(.2,.8,.2,1) both }
      .animate-bounce-slow { animation: sc-bounce-slow 2.4s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) {
        .animate-fade-in, .animate-pop, .animate-slide-up, .animate-slide-in-right, .animate-bounce-slow { animation: none }
        * { scroll-behavior: auto !important }
      }
      html { scroll-behavior: smooth }
      /* A new chapter always starts at the top; never let the browser "anchor" us to the old page's bottom */
      body { overflow-anchor: none }
      /* Keyboard users always see where they are */
      :focus-visible { outline: 3px solid #7c3aed; outline-offset: 2px }
      button:focus:not(:focus-visible) { outline: none }
      .no-scrollbar::-webkit-scrollbar { display: none }
      .no-scrollbar { scrollbar-width: none }

      @media print {
        @page {
          margin: 1cm;
        }
        body {
          background: white;
          color: black;
        }
        .print\:hidden {
          display: none !important;
        }
        .print\:block {
          display: block !important;
        }
        .print\:shadow-none {
          box-shadow: none !important;
        }
        .print\:border-2 {
          border-width: 2px !important;
        }
        .print\:border-b-2 {
          border-bottom-width: 2px !important;
        }
        .print\:break-inside-avoid {
          break-inside: avoid;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>

</head>

</body>
</html>
